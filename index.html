<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishika Chaudhary | Freelance Web Developer</title>
    <style>
        /* Base Styling */
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f172a; color: #cbd5e1; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background-color: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-width: 500px; width: 90%; padding: 30px; text-align: center; border: 1px solid #334155; }
        
        /* Typography */
        h1 { color: #f8fafc; font-size: 28px; margin-bottom: 5px; }
        .subtitle { color: #38bdf8; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 0; margin-bottom: 20px; }
        p { font-size: 15px; line-height: 1.6; color: #94a3b8; }
        
        /* Skills Tags */
        .skills-container { margin: 25px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .skill-tag { background-color: #1e1b4b; color: #818cf8; border: 1px solid #3730a3; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        
        /* Contact Button */
        .btn { display: inline-block; background: linear-gradient(135deg, #38bdf8, #0369a1); color: #ffffff; text-decoration: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; font-size: 15px; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); transition: transform 0.2s; margin-top: 15px; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="card">

        <p>Hi, I'm Ishika. I love crafting clean websites and managing source code professionally.</p>
        
        <!-- Skills Tags (All tags are now correctly inside this container box) -->
        <div class="skills-container">

            <div class="skill-tag">CSS3</div>
            <div class="skill-tag">Git</div>
            <div class="skill-tag">GitHub</div>

            <div class="skill-tag">VS Code</div>

        <!-- Contact Button -->
        <a href="mailto:ishika798@gmail.com" class="btn">Hire Me / Contact</a>

</body>
